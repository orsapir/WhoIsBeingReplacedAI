name: Deploy to GitHub Pages

on:
  push:
    branches: [ccr-7732a945-m85qpx, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that assets/jobs.js matches the source data
        run: |
          python3 scripts/build_data.py
          git diff --exit-code assets/jobs.js

      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
